name: Android Preview Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated APK to the public download URL
        required: true
        default: false
        type: boolean
  schedule:
    # 18:30 Asia/Shanghai = 10:30 UTC; build a candidate, do not publish.
    - cron: '30 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'apps/mobile-workbench/**'
      - '!apps/mobile-workbench/**/*.md'
      - 'scripts/release-android-preview.sh'
      - 'scripts/publish-android-artifact.sh'
      - '.github/workflows/android-preview-release.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: android-preview-production
  cancel-in-progress: false

env:
  PUBLIC_URL: https://voxember.com/download/android

jobs:
  build-candidate:
    # Scheduled and push builds are candidates only. Manual runs may opt into
    # publishing the exact artifact produced by this run.
    if: github.event_name != 'push' || vars.ANDROID_AUTO_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile-workbench/package-lock.json

      - name: Install Mobile Workbench dependencies
        working-directory: apps/mobile-workbench
        run: npm ci

      - name: Build and validate EAS preview APK
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash scripts/release-android-preview.sh build-artifact "$RUNNER_TEMP/android-release"

      - name: Upload immutable Android candidate
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/android-release
          if-no-files-found: error
          retention-days: 30

  publish-candidate:
    needs: build-candidate
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Download exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: android-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/android-release

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          echo "Deploying exact candidate from run $GITHUB_RUN_ID"

      - name: Configure production SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/voxflame_deploy"
          chmod 600 "$HOME/.ssh/voxflame_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload and atomically publish APK
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh_args=(-i "$HOME/.ssh/voxflame_deploy" -p "$DEPLOY_PORT" -o BatchMode=yes)
          tar -C "$RUNNER_TEMP/android-release" -cf - \
            VoxFlame-Android.apk VoxFlame-Android.json \
            | ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Verify public Android download
        run: |
          headers="$RUNNER_TEMP/android-download-headers.txt"
          curl --fail --silent --show-error --location \
            --range 0-0 --dump-header "$headers" --output /dev/null "$PUBLIC_URL"
          grep -iq '^content-type: application/vnd.android.package-archive' "$headers"
          grep -iq '^cache-control: no-store' "$headers"
