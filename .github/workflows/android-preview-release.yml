name: Android Preview Release

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Build again instead of reusing this main SHA's verified artifact
        default: false
        type: boolean
  schedule:
    # 18:30 Asia/Shanghai. Reuse or build current main, then publish.
    - cron: '30 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'apps/mobile-workbench/**'
      - '!apps/mobile-workbench/**/*.md'
      - 'scripts/release-android-preview.sh'
      - 'scripts/publish-android-artifact.sh'
      - 'scripts/test-android-release-pipeline.py'
      - 'scripts/test-android-release-workflow.cjs'
      - 'scripts/test-android-artifact-publication.py'
      - 'scripts/test-android-retire.py'
      - 'scripts/android-release-workflow.cjs'
      - 'scripts/verify-android-artifact.py'
      - 'scripts/ops/receive-android-ci-artifact.sh'
      - '.github/workflows/android-preview-release.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: android-preview-production
  cancel-in-progress: false

env:
  PUBLIC_URL: https://voxember.com/download/android

jobs:
  select-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      build: ${{ steps.select.outputs.build }}
      artifact_run_id: ${{ steps.select.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: select
        with:
          script: |
            await require('./scripts/android-release-workflow.cjs').selectSource({github, context, core});

  build-candidate:
    needs: select-source
    if: needs.select-source.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: android-build
    steps:
      - name: Check out pinned main source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.select-source.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Check out pinned pipeline tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/apps/mobile-workbench/package-lock.json
      - name: Validate pipeline
        run: python3 tooling/scripts/test-android-release-pipeline.py
      - name: Install Mobile Workbench dependencies
        working-directory: source/apps/mobile-workbench
        run: npm ci
      - name: Build and validate EAS preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VOXFLAME_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          # Normalize copied secret line endings without logging credentials.
          export EXPO_TOKEN="$(printf '%s' "$EXPO_TOKEN" | tr -d '\r\n')"
          bash tooling/scripts/release-android-preview.sh build-artifact "$RUNNER_TEMP/android-release"
      - name: Record candidate provenance
        env:
          SOURCE_SHA: ${{ needs.select-source.outputs.sha }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'android-release'
          metadata = json.loads((root / 'VoxFlame-Android.json').read_text())
          if metadata['gitCommitHash'] != os.environ['SOURCE_SHA']:
              raise SystemExit('EAS source SHA differs from pinned candidate source')
          metadata.update(sourceSha=os.environ['SOURCE_SHA'], workflowSha=os.environ['GITHUB_SHA'],
                          candidateRunId=os.environ['GITHUB_RUN_ID'],
                          versionPatchSha256=hashlib.sha256((root / 'version.patch').read_bytes()).hexdigest())
          (root / 'VoxFlame-Android.json').write_text(json.dumps(metadata, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Candidate {metadata['appVersion']} ({metadata['appBuildVersion']}); "
                            f"EAS {metadata['buildId']}; SHA256 {metadata['sha256']}. "
                            "Build verified; automatic website publication follows. Device acceptance is tracked separately.\n")
          PYCODE
      - name: Upload immutable Android candidate
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/android-release
          if-no-files-found: error
          retention-days: 30

  publish-candidate:
    needs: [select-source, build-candidate]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          needs.select-source.result == 'success' &&
          (needs.build-candidate.result == 'success' ||
           (needs.select-source.outputs.build == 'false' && needs.build-candidate.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ARTIFACT_RUN_ID: ${{ needs.select-source.outputs.artifact_run_id }}
      SOURCE_SHA: ${{ needs.select-source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted build and latest main
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/android-release-workflow.cjs').validatePublication(
              {github, context, core}, process.env.ARTIFACT_RUN_ID, process.env.SOURCE_SHA);
      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: android-preview-${{ needs.select-source.outputs.artifact_run_id }}
          path: ${{ runner.temp }}/android-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.select-source.outputs.artifact_run_id }}
      - name: Verify artifact bytes and provenance before deployment secrets
        run: python3 scripts/verify-android-artifact.py "$RUNNER_TEMP/android-release" "$SOURCE_SHA" "$ARTIFACT_RUN_ID"

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          echo "Deploying exact candidate from run $CANDIDATE_RUN_ID"

      - name: Configure production SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/voxflame_deploy"
          chmod 600 "$HOME/.ssh/voxflame_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Reject main changed during artifact download
        uses: actions/github-script@v7
        with:
          script: |
            const latest = (await github.rest.repos.getCommit({...context.repo, ref: 'main'})).data.sha;
            if (latest !== process.env.SOURCE_SHA) throw new Error('Main advanced; refusing stale release');
      - name: Upload and atomically publish APK
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh_args=(-i "$HOME/.ssh/voxflame_deploy" -p "$DEPLOY_PORT" -o BatchMode=yes)
          tar -C "$RUNNER_TEMP/android-release" -cf - \
            VoxFlame-Android.apk VoxFlame-Android.json \
            | ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Verify public Android download
        run: |
          headers="$RUNNER_TEMP/android-download-headers.txt"
          curl --fail --silent --show-error --location \
            --retry 3 --dump-header "$headers" --output "$RUNNER_TEMP/published.apk" "$PUBLIC_URL"
          grep -iq '^content-type: application/vnd.android.package-archive' "$headers"
          grep -iq '^cache-control: no-store' "$headers"
          cmp "$RUNNER_TEMP/published.apk" "$RUNNER_TEMP/android-release/VoxFlame-Android.apk"
