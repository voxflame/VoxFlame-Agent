name: Mobile Android Maestro

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile-workbench/**'
      - 'backend/src/controllers/mobile-diagnostics.controller.ts'
      - '.github/workflows/mobile-android-maestro.yml'

jobs:
  android-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://voxember.com/api
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
      MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile-workbench/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install mobile dependencies
        working-directory: apps/mobile-workbench
        run: npm ci

      - name: Verify required public client configuration
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"

      - name: Run static release guards
        working-directory: apps/mobile-workbench
        run: |
          npm run check
          npm run typecheck

      - name: Generate Android project
        working-directory: apps/mobile-workbench
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        working-directory: apps/mobile-workbench/android
        run: ./gradlew assembleRelease

      - name: Install Maestro CLI
        run: curl -Ls https://get.maestro.mobile.dev | bash

      - name: Start Android emulator
        run: |
          "$HOME/.maestro/bin/maestro" start-device --platform android --os-version 33

      - name: Install release APK
        run: adb install -r apps/mobile-workbench/android/app/build/outputs/apk/release/app-release.apk

      - name: Run configured-release smoke
        working-directory: apps/mobile-workbench
        run: |
          "$HOME/.maestro/bin/maestro" test \
            --format junit \
            --output maestro-boot-report.xml \
            --debug-output maestro-debug/boot \
            .maestro/release-boot-smoke.yml

      - name: Run authenticated four-surface smoke
        if: "${{ env.MAESTRO_TEST_EMAIL != '' && env.MAESTRO_TEST_PASSWORD != '' }}"
        working-directory: apps/mobile-workbench
        run: |
          "$HOME/.maestro/bin/maestro" test \
            -e MAESTRO_TEST_EMAIL="$MAESTRO_TEST_EMAIL" \
            -e MAESTRO_TEST_PASSWORD="$MAESTRO_TEST_PASSWORD" \
            --format junit \
            --output maestro-authenticated-report.xml \
            --debug-output maestro-debug/authenticated \
            .maestro/authenticated-release-smoke.yml

      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-maestro-evidence
          if-no-files-found: warn
          path: |
            apps/mobile-workbench/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile-workbench/maestro-*-report.xml
            apps/mobile-workbench/maestro-debug/**
            apps/mobile-workbench/*.png
