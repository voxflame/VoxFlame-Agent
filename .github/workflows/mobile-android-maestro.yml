name: Mobile Android Maestro

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile-workbench/**'
      - 'frontend/public/icons/**'
      - 'scripts/mobile-android-smoke.sh'
      - 'scripts/test-mobile-ci.py'
      - 'backend/src/controllers/mobile-diagnostics.controller.ts'
      - '.github/workflows/mobile-android-maestro.yml'

permissions:
  contents: read

concurrency:
  group: mobile-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://voxember.com/api
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      MAESTRO_CLI_NO_ANALYTICS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CI regression guards
        run: python3 scripts/test-mobile-ci.py

      - name: Prepare emulator acceleration
        id: acceleration
        run: |
          # udev rules may not be applied immediately. Set permissions on the
          # existing disposable runner device; never manufacture a KVM device.
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'mode=on' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=off' >> "$GITHUB_OUTPUT"
            echo '::warning::KVM unavailable; running real emulator tests with software acceleration (slower).'
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile-workbench/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install mobile dependencies
        working-directory: apps/mobile-workbench
        run: npm ci

      - name: Verify required public client configuration
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"

      - name: Run static release guards
        working-directory: apps/mobile-workbench
        run: |
          npm run check
          npm run typecheck

      - name: Generate Android project
        working-directory: apps/mobile-workbench
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: apps/mobile-workbench/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64

      - name: Install Maestro CLI
        shell: bash
        run: curl --fail --silent --show-error --location https://get.maestro.mobile.dev | bash

      - name: Run release smoke on headless Android 33
        # Pin the SDK/AVD lifecycle action; it installs missing tools and kills
        # the emulator after the script, including on test failure.
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        timeout-minutes: 15
        env:
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          emulator-options: -accel ${{ steps.acceleration.outputs.mode }} -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash scripts/mobile-android-smoke.sh

      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-maestro-evidence
          if-no-files-found: warn
          path: |
            apps/mobile-workbench/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile-workbench/maestro-*-report.xml
            apps/mobile-workbench/maestro-debug/**
            apps/mobile-workbench/*.png
