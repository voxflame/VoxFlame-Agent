# Keep the existing port and authorized keys. Reduce the amount of time and
# work consumed by unauthenticated Internet scanners.
LoginGraceTime 20
MaxAuthTries 3
MaxStartups 20:40:60
ClientAliveInterval 60
ClientAliveCountMax 3
TCPKeepAlive yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
UseDNS no
