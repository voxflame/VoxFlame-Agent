  rollback_or_withdrawal: disable dialect prompt and revert to Mandarin-only flow; quarantine affected dataset version; retain raw recordings and per-recording withdrawal path
  recheck_date: 2026-09-17
reproducibility:
  code_or_protocol: repository audit at commit a75d292b805700bb4e387665a0b14b62b3df16fe plus source retrieval and metadata contract tests
  data_version_and_license: source snapshots recorded by SHA-256 in research note; no user recordings used
  commit_or_release: a75d292b805700bb4e387665a0b14b62b3df16fe plus working-tree metadata patch
  run_command: cd frontend && npm test; npx tsc --noEmit; npm run build; cd ../backend && npm run build; bash scripts/check_ai_docs.sh; bash scripts/check_research_system.sh; python3 scripts/check_research_harness.py; python3 scripts/research/validate-research-loop.py
  seed_or_determinism: deterministic metadata allow-list tests; no model experiment run
  raw_artifacts: /tmp/voxflame-dialect-research.SzYUqE source snapshots (ephemeral)
uncertainty_and_counterevidence:
  uncertainty: no validated Chinese dialect ontology for all user self-reports; no completed paired-flow device study; no VoxFlame dialect model gain result; OpenReview KeSpeech PDF inaccessible
  counterevidence: self-report may be broad or mixed; dialect ASR may orthographically mismatch semantic success; optional second recording increases burden
  out_of_scope: diagnosis, therapy efficacy, dialect classification as identity inference, production-wide rollout, exact dialect inference from province/city
outcome_gates:
  scholarly: not_applicable
  patent: not_applicable
  software_copyright: not_applicable
